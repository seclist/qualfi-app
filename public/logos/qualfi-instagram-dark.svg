<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .brand-text-dark {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 210px;
        letter-spacing: -6px;
        fill: #ffffff;
      }
    </style>
    <!-- Deep charcoal titanium radial glow -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1c1e24"/>
      <stop offset="70%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
  </defs>

  <!-- Background Base (Square 1080x1080) -->
  <rect width="1080" height="1080" fill="url(#darkBg)" />

  <!-- Subtle Instagram 1:1 Circular Avatar Safe-Zone Outline -->
  <circle cx="540" cy="540" r="500" fill="none" stroke="#2a2d35" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>

  <!-- Centered Qualfi Logo Wordmark -->
  <g transform="translate(540, 565)">
    <text class="brand-text-dark" text-anchor="middle" x="-18" y="55">qualfi</text>
    <!-- Signature terracotta brand dot -->
    <circle cx="316" cy="36" r="26" fill="#d9532f" />
  </g>
</svg>