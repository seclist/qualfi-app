<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .brand-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 210px;
        letter-spacing: -6px;
        fill: #121316;
      }
    </style>
    <!-- Subtle luxury paper texture vignette -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f0ebe1"/>
    </radialGradient>
  </defs>

  <!-- Background Base (Square 1080x1080) -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Subtle Instagram 1:1 Circular Avatar Safe-Zone Outline (Faint) -->
  <circle cx="540" cy="540" r="500" fill="none" stroke="#e8e2d5" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Centered Qualfi Logo Wordmark -->
  <g transform="translate(540, 565)">
    <!-- Main wordmark text, centered horizontally -->
    <text class="brand-text" text-anchor="middle" x="-18" y="55">qualfi</text>
    <!-- Signature terracotta brand dot -->
    <circle cx="316" cy="36" r="26" fill="#d9532f" />
  </g>
</svg>